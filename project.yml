name: Hamyon
options:
  bundleIdPrefix: uz.fayzullo
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: ru
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 7FLXRPUT5S
    CODE_SIGN_STYLE: Automatic
targets:
  Hamyon:
    type: application
    platform: iOS
    sources:
      - Hamyon
      - Shared
    dependencies:
      - target: HamyonWidget
    entitlements:
      path: Hamyon/Hamyon.entitlements
      properties:
        com.apple.security.application-groups: [group.uz.fayzullo.hamyon]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    info:
      path: Hamyon/Info.plist
      properties:
        CFBundleDisplayName: Hamyon
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Чтобы записывать расходы голосом.
        NSSpeechRecognitionUsageDescription: Чтобы превращать вашу речь в текст расхода.
        NSFaceIDUsageDescription: Чтобы открывать ваши финансы по Face ID.
        NSContactsUsageDescription: Чтобы вы могли пригласить друзей в Hamyon по SMS или в Telegram. Контакты не покидают телефон.
        NSSupportsLiveActivities: true
        AnthropicAPIKey: $(ANTHROPIC_API_KEY)
        GeminiAPIKey: $(GEMINI_API_KEY)
        CFBundleDocumentTypes:
          - CFBundleTypeName: Выписка
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf, public.image]
          - CFBundleTypeName: Выписка Excel
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.openxmlformats.spreadsheetml.sheet, com.microsoft.excel.xls, public.comma-separated-values-text, public.spreadsheet]
        LSSupportsOpeningDocumentsInPlace: false
        BGTaskSchedulerPermittedIdentifiers: [uz.fayzullo.hamyon.import.statement]
        UIBackgroundModes: [processing]
        CFBundleURLTypes:
          - CFBundleURLName: uz.fayzullo.hamyon
            CFBundleURLSchemes: [hamyon]
    scheme:
      testTargets:
        - HamyonUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.fayzullo.hamyon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Только для съёмки промо в симуляторе: нажимает то, что нельзя нажать командой.
  HamyonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HamyonUITests
    dependencies:
      - target: Hamyon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.fayzullo.hamyon.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Hamyon
  HamyonWidget:
    type: app-extension
    platform: iOS
    sources:
      - HamyonWidget
      - Shared
    entitlements:
      path: HamyonWidget/HamyonWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.uz.fayzullo.hamyon]
    info:
      path: HamyonWidget/Info.plist
      properties:
        CFBundleDisplayName: Hamyon
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.fayzullo.hamyon.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
